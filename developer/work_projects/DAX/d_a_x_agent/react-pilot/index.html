<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAX Agent</title>
    <!-- Status Bar color in Safari browser (iOS) and PWA — mirrors Flutter web/index.html -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2428" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Resolve the persisted theme (zustand `ff_settings_state`) before first
         paint so a dark user never sees a light flash. Kept defensive: any
         malformed/missing JSON falls back to system preference. Kept in sync
         after hydration by src/theme/useThemeMode.ts. -->
    <script>
      (function () {
        var mode = 'system';
        try {
          var raw = localStorage.getItem('ff_settings_state');
          if (raw) {
            var parsed = JSON.parse(raw);
            var stored = parsed && parsed.state && parsed.state.themeMode;
            if (stored === 'light' || stored === 'dark') mode = stored;
          }
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        );
      })();
    </script>
  </head>
  <body>
    <!-- Capture PWA install prompt early so the app can trigger it later
         (mirrors the Flutter web/index.html __pwaInstallPrompt script). -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
